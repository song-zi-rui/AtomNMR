<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>导出数据 · AtomNMR</title><link rel="stylesheet" href="/ai.css"><style>main{max-width:1000px}.export-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.export-grid .card{margin-bottom:0}.check{font-weight:400;line-height:1.7}#progress{margin-top:18px}.filter-summary{padding:12px;background:#f3f7f5;border-radius:8px;line-height:1.8}.done-links{display:flex;gap:15px;margin:15px 0}#examples{max-height:230px;overflow:auto}#exampleRows a{font-size:13px}@media(max-width:700px){.export-grid{grid-template-columns:1fr}nav{flex-wrap:wrap}.intro h1{font-size:24px}}</style></head><body>
<header><a class="brand" href="/">AtomNMR</a><strong>/ 导出数据</strong><nav><a href="/">数据库</a><a href="/auto.html">自动标注</a><a href="/statistics.html">数据统计</a></nav></header>
<main><section class="intro"><div><h1>选择需要的数据，再导出</h1><p>导出已保存的数据。筛选只影响本次文件，数据库中的结构、谱图和归属保持原样。</p></div></section><div id="message" class="notice" hidden role="status"></div>
<div class="export-grid"><section class="card"><h2>1．选择谱与格式</h2>
<label>谱类型<select id="spectrumType"><option value="experimental">实验谱</option><option value="computed">模拟谱</option></select></label>
<label>谱来源<select id="spectrumSource"><option value="">当前类型的全部来源</option></select></label>
<label>分子检索<input id="query" placeholder="可选：分子编号、分子式、SMILES"></label>
<label>导出格式<select id="format"><option value="parquet">Parquet · 批量分析</option><option value="jsonl">JSONL · 完整记录</option><option value="lmdb">LMDB · 带逐峰归属掩码</option><option value="atompeak">AtomPeak 训练包 · 自动划分与配套词表</option></select></label>
<details id="trainingOptions" hidden><summary>训练包参数</summary><div class="two"><label>随机种子<input id="seed" type="number" value="42"></label><label>最大输入长度<input id="maxSeq" type="number" min="8" max="8192" value="1024"></label></div><div class="two"><label>验证集比例<input id="validRatio" type="number" min="0" max="0.9" step="0.01" value="0.1"></label><label>测试集比例<input id="testRatio" type="number" min="0" max="0.9" step="0.01" value="0.1"></label></div><label class="check"><input id="useSolvent" type="checkbox">输入各核种的溶剂信息</label><p class="hint">按分子连接层分组划分；超长记录不截断，另行记入跳过清单。</p></details>
</section><section class="card"><h2>2．按分子筛选</h2>
<label>归属情况<select id="coverage"><option value="all">全部归属情况</option><option value="full">全部归属</option><option value="partial">部分归属</option><option value="none">无归属</option></select></label>
<label>核种组合<select id="nuclei"><option value="all">全部核种组合</option><option value="dual">全双谱（H 谱和 C 谱都有）</option><option value="proton_only">仅 H 谱</option><option value="carbon_only">仅 C 谱</option></select></label>
<p class="hint" id="coverageHelp">只按本次所选类型和来源内的谱计算。歧义峰和弱标签不计入确定归属。</p>
<details><summary>更多条件</summary>
<label class="check"><input id="sameSolvent" type="checkbox">只保留至少一对已知同溶剂的实验 C/H 谱</label>
<label>筛除 ShiftDB2 等价原子疑似问题<select id="equivalence"><option value="none">关闭</option><option value="carbon_missing">C 谱疑似漏标成员</option><option value="hc_missing">C/H 谱疑似漏标成员</option><option value="any_incomplete_group">含漏标或等价组拆散候选</option></select></label>
</details>
</section></div>
<section class="card" style="margin-top:22px"><h2>3．预览与导出</h2><p id="summary" class="filter-summary"></p><div class="actions"><button id="preview">预览筛选数量</button><button id="run" class="primary">生成导出文件</button></div><p class="hint">导出使用当前有效谱。全库预览和导出可能耗时，标注更新后两次统计可能不同。</p>
<div id="progress" role="status" aria-live="polite"></div><div id="downloads" class="done-links"></div>
<div id="sourceBreakdown" class="tablewrap" hidden><table><thead><tr><th>实际选用的谱来源</th><th>训练</th><th>验证</th><th>测试</th></tr></thead><tbody id="sourceRows"></tbody></table></div>
<div id="selection" hidden><h3>筛选结果</h3><p id="counts"></p><div class="tablewrap"><table><thead><tr><th>筛除原因（可能重叠）</th><th>分子数</th></tr></thead><tbody id="reasonRows"></tbody></table></div><details id="examples" hidden><summary>导出示例</summary><div id="exampleRows"></div></details></div><p id="note" class="hint"></p>
</section></main><script src="/export.js"></script></body></html>
